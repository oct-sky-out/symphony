name: make-all

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  # ── 1. Format check ────────────────────────────────────────────────────────
  fmt-check:
    name: Format check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elixir

    steps:
      - uses: actions/checkout@v4

      - name: Set up mise tools
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
          working_directory: elixir

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: elixir/deps
          key: ${{ runner.os }}-deps-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: ${{ runner.os }}-deps-

      - name: Install deps
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

  # ── 2. Lint (credo + specs) ────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elixir

    steps:
      - uses: actions/checkout@v4

      - name: Set up mise tools
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
          working_directory: elixir

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: elixir/deps
          key: ${{ runner.os }}-deps-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: ${{ runner.os }}-deps-

      - name: Install deps
        run: mix deps.get

      - name: Run lint
        run: mix lint

  # ── 3. Tests + coverage ───────────────────────────────────────────────────
  test:
    name: Test (coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elixir

    steps:
      - uses: actions/checkout@v4

      - name: Set up mise tools
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
          working_directory: elixir

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            elixir/deps
            elixir/_build
          key: ${{ runner.os }}-mix-test-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-test-

      - name: Install deps
        run: mix deps.get

      - name: Build
        run: mix escript.build

      - name: Run tests with coverage
        run: mix test --cover

  # ── 4. Dialyzer ──────────────────────────────────────────────────────────
  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elixir

    steps:
      - uses: actions/checkout@v4

      - name: Set up mise tools
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
          working_directory: elixir

      - name: Cache deps and PLT
        uses: actions/cache@v4
        with:
          path: |
            elixir/deps
            elixir/_build
          key: ${{ runner.os }}-dialyzer-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: ${{ runner.os }}-dialyzer-

      - name: Install deps
        run: mix deps.get

      - name: Run Dialyzer
        run: mix dialyzer --format short
